{% extends 'admin/settings.html' %}

{% block settings_content %}
<div id="verificators" class="content-tab">
    <section class="settings-panel">
        <h2>{{ get_translate('html.admin.settings.verificators.title', session.user_lang) }}</h2>
        <div class="verificators-actions">
            <span class="notify" id="status" role="status" aria-live="polite"></span>
            <button id="saveBtn" class="btn btn-settings btn-save" type="button">Save</button>
        </div>

        <div class="verificators-list">
            {% for v in verificators %}
            <div class="verificator-item" data-id="{{ v.id }}">
                <div class="verificator-header{{ '' if v.enabled else ' verificator-disabled' }}">
                    <span class="drag-handle" draggable="true">☰</span>
                    <span class="verificator-title">{{ v.name }}</span>
                    <span class="verificator-toggle">▼</span>
                </div>
                
                <div class="verificator-body">
                    <div class="verificator-body-inner">
                        <div class="verificator-settings">
                            <div class="field">
                                <label class="settings-label">
                                    Enabled:
                                    <input type="checkbox" name="enabled_{{ v.id }}" {{ 'checked' if v.enabled else '' }}>
                                </label>
                            </div>
                            {% for f in v.fields %}
                            <div class="field">
                                <label class="settings-label">
                                    {{ f.label }}:
                                    <input class="input input-settings" type="{{ f.type }}" name="{{ f.name }}_{{ v.id }}" value="{{ f.value }}">
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
    </section>
</div>

<style>
.verificators-actions {
    margin-bottom: 15px;
    display: flex;
    justify-content: flex-end;
}

.verificator-item {
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 10px;
    overflow: hidden;
}

.verificator-disabled {
    color: #999;
}

.verificator-header {
    padding: 12px;
    background: #f5f5f5;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.verificator-title {
    font-weight: 600;
}

.verificator-body {
    height: 0;
    overflow: hidden;
    transition: height 0.25s ease;
    background: #fff;
}

.verificator-body-inner {
    padding: 15px;
}

.verificator-item.active .verificator-body {
    max-height: 300px; /* достаточно большое значение */
    padding: 15px;
}

.verificator-toggle {
    transition: transform 0.2s ease;
}

.verificator-item.active .verificator-toggle {
    transform: rotate(180deg);
}

.drag-handle {
    cursor: grab;
    margin-right: 10px;
    user-select: none;
}

.drag-handle:active {
    cursor: grabbing;
}

.verificator-item.dragging {
    opacity: 0.5;
}

.verificator-item {
    transition: transform 0.15s ease;
}

</style>


<script>
function getOrder() {
    const ids = [...document.querySelectorAll('.verificator-item')]
        .map(el => el.dataset.id);
    return ids;
}

document.addEventListener('DOMContentLoaded', function () {
    const list = document.querySelector('.verificators-list');
    const items = document.querySelectorAll('.verificator-item');

    items.forEach(item => {
        const id = item.dataset.id;
        const enabledCheckbox = item.querySelector('input[name="enabled_' + id + '"]');
        const header = item.querySelector('.verificator-header');
        enabledCheckbox.addEventListener('change', function (e) {
            if (enabledCheckbox.checked) {
                header.classList.remove('verificator-disabled');
            } else {
                header.classList.add('verificator-disabled');
            }
        });
    });
    
    const saveBtn = document.getElementById('saveBtn');

    saveBtn.addEventListener('click', function (e) {
        let data = { order: getOrder(), verificators: [] };
        items.forEach(item => {
            const id = item.dataset.id;
            const enabledCheckbox = item.querySelector('input[name="enabled_' + id + '"]');
            const enabled = enabledCheckbox ? enabledCheckbox.checked : true;

            const fields = {};
            item.querySelectorAll('.input')
                .forEach(input => {
                    fields[input.name.replace(`_${id}`, '')] = input.value;
                });

            data.verificators.push({
                id: id,
                enabled: enabled,
                fields: fields
            });
        });

        console.log(data);

        fetch('/admin/settings/verificators/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(response => response.json())
            .then(result => {
                if (result.success) {
                    showStatus(getTranslate('html.admin.settings.saved'), true);
                } else {
                    showStatus(getTranslate('html.admin.settings.failed'), false);
                }
            })
            .catch(error => console.error('Error:', error));;
    });
    
    // Перетаскивания очереди
    let draggedItem = null;

    list.addEventListener('dragstart', function (e) {
        if (!e.target.classList.contains('drag-handle')) return;

        draggedItem = e.target.closest('.verificator-item');
        draggedItem.classList.add('dragging');

        e.dataTransfer.effectAllowed = 'move';
    });

    list.addEventListener('dragend', function () {
        if (!draggedItem) return;

        draggedItem.classList.remove('dragging');
        draggedItem = null;
    });

    list.addEventListener('dragover', function (e) {
        e.preventDefault();

        if (!draggedItem) return;

        const afterElement = getDragAfterElement(list, e.clientY);

        if (!afterElement) {
            list.appendChild(draggedItem);
        } else {
            list.insertBefore(draggedItem, afterElement);
        }
    });

    function getDragAfterElement(container, y) {
        const elements = [...container.querySelectorAll('.verificator-item:not(.dragging)')];

        return elements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;

            if (offset < 0 && offset > closest.offset) {
                return { offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Сворачивание разворачивание
    items.forEach(item => {
        const header = item.querySelector('.verificator-header');
        const body = item.querySelector('.verificator-body');

        header.addEventListener('click', () => {
            const isOpen = body.style.height && body.style.height !== '0px';

            if (isOpen) {
                // Закрытие
                body.style.height = body.scrollHeight + 'px';
                requestAnimationFrame(() => {
                    body.style.height = '0px';
                });
            } else {
                // Открытие
                body.style.height = body.scrollHeight + 'px';

                body.addEventListener('transitionend', function handler() {
                    body.style.height = 'auto';
                    body.removeEventListener('transitionend', handler);
                });
            }
        });
    });
});
</script>
{% endblock %}
