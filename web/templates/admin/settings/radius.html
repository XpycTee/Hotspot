{% extends 'admin/settings.html' %}

{% block settings_content %}
<div id="radius" class="content-tab">
    <section class="settings-panel">
        <h2>{{ get_translate('html.admin.settings.radius.title', session.user_lang) }}</h2>

        {% include "structures/list.html" %}
    </section>
</div>

<script>
function saveItems(data) {
    return fetch("{{ url_for('pages.admin.settings.radius.update') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(response => response.json())
        .catch(error => console.error('Error:', error));
}

function saveItem(data) {
    return fetch("{{ url_for('pages.admin.settings.radius.update') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(response => response.json())
        .catch(error => console.error('Error:', error));
}

function deleteItem(data) {
    return fetch("{{ url_for('pages.admin.settings.radius.delete') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(response => response.json())
        .catch(error => console.error('Error:', error));
}
</script>
{% endblock %}
