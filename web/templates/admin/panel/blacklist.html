{% extends 'admin/panel.html' %}

{% block panel_content %}
<div id="blacklist" class="content-tab">
    {% include "structures/list.html" %}
</div>

<script>
function normalizePhone(phone) {
    return (phone || '').replace(/\D/g, '').replace(/^(\+?7|8)/, '7');
}

function saveItems(data) {
    const items = data.items || [];
    return Promise.all(items.map(item => saveItem(item))).then(results => {
        const failedResult = results.find(result => !result || !result.success);
        return failedResult || { success: true };
    });
}

function saveItem(data) {
    const payload = {
        phone: normalizePhone((data.fields || {}).phone),
    };

    return fetch("{{ url_for('pages.admin.tables.save_data', table_name='blacklist') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(response => response.json())
      .catch(error => {
          console.error('Error:', error);
          return { success: false, error: { description: 'Network error' } };
      });
}

function deleteItem(data) {
    const payload = data.id.startsWith('new_')
        ? { phone: normalizePhone((data.fields || {}).phone) }
        : { phone: normalizePhone(data.id) };

    return fetch("{{ url_for('pages.admin.tables.delete_data', table_name='blacklist') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(response => response.json())
      .catch(error => {
          console.error('Error:', error);
          return { success: false, error: { description: 'Network error' } };
      });
}
</script>
{% endblock %}
