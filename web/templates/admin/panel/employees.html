{% extends 'admin/panel.html' %}

{% block panel_content %}
<div id="employees" class="content-tab">
    <section class="settings-panel">
        <h2>{{ get_translate('html.admin.panel.employees.title', session.user_lang) }}</h2>

        {% include "structures/list.html" %}
    </section>
</div>

<script>
function toEmployeePayload(data) {
    const fields = data.fields || {};
    const phones = Array.isArray(fields.phone) ? fields.phone : [fields.phone];
    const payload = {
        lastname: (fields.lastname || '').trim(),
        name: (fields.name || '').trim(),
        phone: phones.map(phone => (phone || '').trim()).filter(Boolean),
    };

    if (!data.id.startsWith('new_')) {
        payload.id = Number(data.id);
    }

    return payload;
}

function saveItems(data) {
    const items = data.items || [];
    return Promise.all(items.map(item => saveItem(item))).then(results => {
        const failedResult = results.find(result => !result || !result.success);
        return failedResult || { success: true };
    });
}

function saveItem(data) {
    return fetch("{{ url_for('pages.admin.tables.save_data', table_name='employees') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toEmployeePayload(data))
    }).then(response => response.json())
      .catch(error => {
          console.error('Error:', error);
          return { success: false, error: { description: 'Network error' } };
      });
}

function deleteItem(data) {
    if (data.id.startsWith('new_')) {
        return Promise.resolve({ success: true });
    }

    return fetch("{{ url_for('pages.admin.tables.delete_data', table_name='employees') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(data.id) })
    }).then(response => response.json())
      .catch(error => {
          console.error('Error:', error);
          return { success: false, error: { description: 'Network error' } };
      });
}
</script>
{% endblock %}
