<div id="blacklist" class="content-tab table-container" style="display: none;">
    <div class="filters-panel">
        <div class="filters-row">
            <input type="text" id="blacklist_search" class="filter-input table-search" placeholder="{{ get_translate('placeholders.search', session.user_lang) }}">
        </div>
        <span class="filter-label found-count"></span>
    </div>
    <table>
        <thead>
            <tr>
                <th>{{ get_translate('html.admin.panel.tables.blacklist.phone', session.user_lang) }}</th>
                <th class="column-controls">{{ get_translate('html.admin.panel.tables.controls', session.user_lang) }}</th>
            </tr>
        </thead>
        <tbody id="blacklist_body">
            <tr class="add_row_button">
                <td colspan="2"><button class="btn btn-add" onclick="addRowModal(this, 'blacklist')">{{ get_translate('buttons.add', session.user_lang) }}</button></td>
            </tr>
        </tbody>
    </table>
    <div class="pagination">
        <button class="btn btn-prev" onclick="changePage('blacklist', -1)">{{ get_translate('buttons.prev', session.user_lang) }}</button>
        <div class="page_numbers">
            <!--button class="btn btn-number" onclick="changePageTo('blacklist', X)">X</button-->
        </div>
        <button class="btn btn-next" onclick="changePage('blacklist', 1)">{{ get_translate('buttons.next', session.user_lang) }}</button>
        <span class="page_info"></span>
    </div>
</div>
