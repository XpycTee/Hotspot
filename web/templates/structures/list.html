<div class="list">
    <div class="list-body">
        {% for key, item in data.items() %}
        <div class="item" data-id="{{ key }}">
            {% include "structures/item.html" %}
        </div>
        {% endfor %}
    </div>
    {% if actions %}
    <div class="actions list-actions">
        {% if 'add' in actions %}
        <button class="btn btn-wide btn-add" type="button">{{ get_translate('buttons.add', session.user_lang) }}</button>
        {% endif %}
    </div>
    {% endif %}
</div>
<script>
function createFieldListItem(id, fieldName, required = false, value = '', inputType = 'text', usePhoneMask = false) {
    const li = document.createElement('li');
    li.className = 'field-list-item';

    const input = document.createElement('input');
    input.className = 'input input-settings';
    input.type = inputType;
    input.name = `${fieldName}_${id}`;
    input.value = value;
    input.dataset.array = 'true';
    if (usePhoneMask) {
        input.setAttribute('data-tel-input', '');
    }
    if (required) {
        input.required = true;
    }

    if (usePhoneMask && typeof detectPhoneInput === 'function') {
        detectPhoneInput(input);
    }

    const deleteButton = document.createElement('button');
    deleteButton.className = 'btn btn-delete btn-controls btn-remove-list-field';
    deleteButton.type = 'button';
    deleteButton.textContent = 'x';

    li.appendChild(input);
    li.appendChild(deleteButton);
    return li;
}

function bindFieldListField(item, field) {
    const list = field.querySelector('.field-list');
    const addButton = field.querySelector('.btn-add-list-field');
    if (!list || !addButton) {
        return;
    }

    const fieldName = list.dataset.fieldName;
    const id = item.dataset.id;
    const isRequired = list.querySelector('input')?.required || false;
    const inputType = list.dataset.inputType || 'text';
    const usePhoneMask = list.dataset.usePhoneMask === 'true';

    list.querySelectorAll('input').forEach(input => {
        if (usePhoneMask && typeof detectPhoneInput === 'function') {
            detectPhoneInput(input);
        }
    });

    addButton.addEventListener('click', () => {
        list.appendChild(createFieldListItem(id, fieldName, isRequired, '', inputType, usePhoneMask));
    });

    list.addEventListener('click', event => {
        const deleteButton = event.target.closest('.btn-remove-list-field');
        if (!deleteButton) {
            return;
        }

        const itemNode = deleteButton.closest('.field-list-item');
        if (!itemNode) {
            return;
        }

        if (list.querySelectorAll('.field-list-item').length <= 1) {
            const input = itemNode.querySelector('input');
            if (input) {
                input.value = '';
            }
            return;
        }

        itemNode.remove();
    });
}

function collectItemFields(item, id) {
    const fields = {};

    item.querySelectorAll(`input[name$="_${id}"], select[name$="_${id}"], textarea[name$="_${id}"]`)
        .forEach(control => {
            const fieldName = control.name.replace(`_${id}`, '');
            if (fieldName === 'enabled') {
                return;
            }

            if (control.type === 'checkbox') {
                fields[fieldName] = control.checked;
                return;
            }

            if (control.type === 'radio') {
                if (control.checked) {
                    fields[fieldName] = control.value;
                }
                return;
            }

            if (control.dataset.array === 'true') {
                if (!Array.isArray(fields[fieldName])) {
                    fields[fieldName] = [];
                }

                fields[fieldName].push(control.value);
                return;
            }

            fields[fieldName] = control.value;
        });

    return fields;
}

async function beforeDeleteItem(item) {
    const id = item.dataset.id;
    if (id.startsWith('new_')) {
        item.remove();
        return;
    }

    const result = await deleteItem({ id: id });
    if (result && result.success) {
        item.remove();
    } else {
        alert(result.error.description);
    }
}

async function beforeSaveItems(listBody) {
    let data = { items: [] };

    const items = listBody.querySelectorAll('.item');
    items.forEach(item => {
        const id = item.dataset.id;
        const enabledCheckbox = item.querySelector('input[name="enabled_' + id + '"]');
        const enabled = enabledCheckbox ? enabledCheckbox.checked : true;
        const fields = collectItemFields(item, id);

        data.items.push({
            id: id,
            enabled: enabled,
            fields: fields
        });
    });
    
    const result = await saveItems(data);
    if (result && result.success) {
        location.reload();
    } else {
        alert(result.error.description);
    }
}

async function beforeSaveItem(item) {
    const id = item.dataset.id;
    const enabledCheckbox = item.querySelector('input[name="enabled_' + id + '"]');
    const enabled = enabledCheckbox ? enabledCheckbox.checked : true;
    const fields = collectItemFields(item, id);

    let data = {
        id: id,
        enabled: enabled,
        fields: fields
    }
    
    const result = await saveItem(data);
    if (result && result.success) {
        location.reload();
    } else {
        alert(result.error.description);
    }
}

function toggleAccordion(body) {
    const isOpen = body.style.height && body.style.height !== '0px';

    if (isOpen) {
        body.style.height = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
            body.style.height = '0px';
        });
    } else {
        body.style.height = body.scrollHeight + 'px';

        body.addEventListener('transitionend', function handler() {
            body.style.height = 'auto';
            body.removeEventListener('transitionend', handler);
        });
    }
}

function iconEye() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5.5 0-9.5 5.5-9.5 7s4 7 9.5 7 9.5-5.5 9.5-7-4-7-9.5-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>';
}

function iconEyeOff() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.3 4.3 3 21 19.7 19.7 21l-3-3A11.2 11.2 0 0 1 12 19c-5.5 0-9.5-5.5-9.5-7 0-1 .9-2.4 2.3-3.8L3 4.3zm5 5 7.7 7.7A4 4 0 0 1 8 9.3zM12 5c5.5 0 9.5 5.5 9.5 7 0 .8-.6 2-1.6 3.2l-2.2-2.2c.2-.3.3-.7.3-1a4 4 0 0 0-4-4c-.3 0-.7.1-1 .2L10.8 6A9.7 9.7 0 0 1 12 5z"/></svg>';
}

function bindPasswordToggle(item) {
    const buttons = item.querySelectorAll('.btn-toggle-password');
    buttons.forEach(button => {
        button.addEventListener('click', () => {
            const targetName = button.dataset.targetInput;
            const targetInput = item.querySelector(`input[name="${targetName}"]`);
            if (!targetInput) return;

            const showLabel = button.dataset.showLabel;
            const hideLabel = button.dataset.hideLabel;
            const isHidden = targetInput.type === 'password';

            targetInput.type = isHidden ? 'text' : 'password';
            button.innerHTML = isHidden ? iconEyeOff() : iconEye();
            button.title = isHidden ? hideLabel : showLabel;
            button.setAttribute('aria-label', isHidden ? hideLabel : showLabel);
        });
    });
}

function bindItemEvents(item) {
    const header = item.querySelector('.item-header');
    const body = item.querySelector('.item-body');
    const deleteBtn = item.querySelector('.btn-delete');
    const saveBtn = item.querySelector('.btn-save');

    if (saveBtn) {
        saveBtn.addEventListener('click', async () => {
            await beforeSaveItem(item);
        });
    }

    if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
            await beforeDeleteItem(item);
        });
    }

    header.addEventListener('click', () => {
        toggleAccordion(body);
    });

    item.querySelectorAll('.field').forEach(field => {
        bindFieldListField(item, field);
    });

    bindPasswordToggle(item);
}

document.addEventListener('DOMContentLoaded', function () {
    const list = document.querySelector('.list');
    const listBody = list.querySelector('.list-body');
    const items = listBody.querySelectorAll('.item');
    const actions = list.querySelector('.list-actions');
    const addItemBtn = actions ? actions.querySelector('.btn-add') : null;
    let verificatorCounter = 1000; // временный ID до сохранения

    if (addItemBtn) {
        addItemBtn.addEventListener('click', () => {
            const newId = 'new_' + verificatorCounter++;

            const item = document.createElement('div');
            item.className = 'item';
            item.dataset.id = newId;

            item.innerHTML = `
            {% with key='${newId}', item=empty_item %}
                {% include "structures/item.html" %}
            {% endwith %}`;

            listBody.appendChild(item);
            const body = item.querySelector('.item-body');

            bindItemEvents(item);
            toggleAccordion(body);
        });
    }

    items.forEach(item => {
        bindItemEvents(item);
    });
});
</script>
