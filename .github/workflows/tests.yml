name: Hotspot Tests

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Cleanup old redis container
      run: |
        docker rm -f redis || true
    
    - name: Start Redis
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 8

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Init DB
      env: 
        HOTSPOT_DB_URL: "sqlite:///test.db"
      run: |
        python init_database.py
        
    - name: Run tests
      env: 
        HOTSPOT_LOG_LEVEL: debug
        HOTSPOT_DB_URL: "sqlite:///test.db"
        HOTSPOT_REDIS_URL: "redis://127.0.0.1:6379/0"
      run: |
        pytest tests
